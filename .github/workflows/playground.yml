name: playground

on:
  push:
    paths:
      - 'pages/playground/**'
      - 'playground-tests/**'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run playground tests
        run: node --test playground-tests/
