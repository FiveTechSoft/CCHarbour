name: build-mac

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Harbour is built from source once and cached.
      - name: Cache Harbour
        id: harbour-cache
        uses: actions/cache@v4
        with:
          path: harbour-bin
          key: harbour-macos-v1

      - name: Build Harbour from source
        if: steps.harbour-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/harbour/core.git harbour-src
          cd harbour-src
          export HB_PLATFORM=darwin
          export HB_COMPILER=clang
          export HB_BUILD_CONTRIBS=no
          export HB_INSTALL_PREFIX="$GITHUB_WORKSPACE/harbour-bin"
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: Build cc (macOS)
        run: |
          export PATH="$GITHUB_WORKSPACE/harbour-bin/bin:$PATH"
          export HB_INSTALL_PREFIX="$GITHUB_WORKSPACE/harbour-bin"
          hbmk2 cc_mac.hbp

      - name: Upload cc (macOS) artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-macos
          path: cc

      # Rename so the release asset does not collide with other platforms.
      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp cc cc-macos

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cc-macos
          body_path: releasenotes.md
