name: build-linux

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Harbour is built from source once and cached.
      - name: Cache Harbour
        id: harbour-cache
        uses: actions/cache@v4
        with:
          path: harbour-bin
          key: harbour-linux-v1

      - name: Build Harbour from source
        if: steps.harbour-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/harbour/core.git harbour-src
          cd harbour-src
          export HB_PLATFORM=linux
          export HB_COMPILER=gcc
          export HB_BUILD_CONTRIBS=no
          export HB_INSTALL_PREFIX="$GITHUB_WORKSPACE/harbour-bin"
          make -j$(nproc)
          make install

      - name: Build cc (Linux)
        run: |
          export PATH="$GITHUB_WORKSPACE/harbour-bin/bin:$PATH"
          export HB_INSTALL_PREFIX="$GITHUB_WORKSPACE/harbour-bin"
          hbmk2 cc_linux.hbp

      - name: Upload cc (Linux) artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-linux
          path: cc

      # Rename so the release asset does not collide with other platforms.
      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp cc cc-linux

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cc-linux
          body_path: releasenotes.md
