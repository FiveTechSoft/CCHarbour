<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#00bcd4" stroke-width="4"/>
  
  <!-- Hull of the ship -->
  <path d="M 30 140 L 170 140 L 150 170 L 50 170 Z" fill="#00838f" stroke="#00bcd4" stroke-width="2"/>
  
  <!-- Deck -->
  <rect x="50" y="125" width="100" height="15" rx="3" fill="#00acc1"/>
  
  <!-- Mast -->
  <rect x="97" y="40" width="6" height="85" rx="2" fill="#546e7a"/>
  
  <!-- Sail left -->
  <path d="M 97 50 Q 60 80 97 110 Z" fill="#e0f7fa" stroke="#00bcd4" stroke-width="1.5"/>
  
  <!-- Sail right -->
  <path d="M 103 50 Q 140 80 103 110 Z" fill="#b2ebf2" stroke="#00bcd4" stroke-width="1.5"/>
  
  <!-- Crow's nest -->
  <rect x="91" y="35" width="18" height="8" rx="2" fill="#00acc1"/>
  
  <!-- Flag -->
  <path d="M 103 35 L 130 30 L 103 25 Z" fill="#e91e63"/>
  
  <!-- Water waves -->
  <path d="M 20 145 Q 35 140 50 145 Q 65 150 80 145 Q 95 140 110 145 Q 125 150 140 145 Q 155 140 170 145 Q 180 148 190 145"
        fill="none" stroke="#4dd0e1" stroke-width="2" opacity="0.6"/>
  <path d="M 20 150 Q 35 147 50 150 Q 65 153 80 150 Q 95 147 110 150 Q 125 153 140 150 Q 155 147 170 150 Q 180 152 190 150"
        fill="none" stroke="#26c6da" stroke-width="2" opacity="0.4"/>
  
  <!-- CCHarbour text -->
  <text x="100" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00bcd4">CCHarbour</text>
</svg>
